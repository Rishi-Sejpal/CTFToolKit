<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">CTFToolKit Logo</title>
  <desc id="desc">Amber cyber shield enclosing a terminal prompt and connected circuit nodes, followed by CTFToolKit.</desc>
  <defs>
    <linearGradient id="amber" x1="34" y1="34" x2="172" y2="202" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC247"/>
      <stop offset="0.52" stop-color="#FF9F0A"/>
      <stop offset="1" stop-color="#E85A0C"/>
    </linearGradient>
    <linearGradient id="inner" x1="70" y1="82" x2="148" y2="166" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF0C2"/>
      <stop offset="1" stop-color="#FFAB21"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1 0 0.48 0 0 0.28 0 0 0.05 0 0 0 0 0 0.55 0" result="tint"/>
      <feMerge><feMergeNode in="tint"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(16 22)" filter="url(#glow)">
    <path d="M94 8 164 48V128L94 170 24 128V48L94 8Z" stroke="url(#amber)" stroke-width="9" stroke-linejoin="round"/>
    <path d="M94 25 149 56V120L94 153 39 120V56L94 25Z" stroke="#FFB32D" stroke-opacity=".34" stroke-width="2"/>
    <path d="m66 71 22 19-22 19" stroke="url(#inner)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M98 111h27" stroke="url(#inner)" stroke-width="9" stroke-linecap="round"/>
    <path d="M116 51v13h18v11" stroke="#FFB52E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="134" cy="81" r="6" fill="#FFC247"/>
    <path d="M117 124v10h-16" stroke="#FFB52E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="95" cy="134" r="5" fill="#FF9F0A"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-weight="800" letter-spacing="-5">
    <text x="226" y="211" font-size="112" fill="#F5F6F8">CTF</text>
    <text x="428" y="211" font-size="112" fill="url(#amber)">Tool</text>
    <text x="650" y="211" font-size="112" fill="#F5F6F8">Kit</text>
  </g>
  <path d="M230 250H820" stroke="url(#amber)" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/>
  <text x="230" y="287" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" letter-spacing="6" fill="#93A0B2">THE CTF WORKSTATION</text>
</svg>
